<!-- Styles and copy button for the boxes added by _filters/book-extras.lua -->
<style>
.book-extras {
  margin: 2.5rem 0 0;
  font-size: 0.875rem;
  line-height: 1.45;
}
.book-extras-box {
  border: 1px solid var(--bs-border-color, #dee2e6);
  border-radius: 6px;
  padding: 0.6rem 0.85rem;
  margin: 0 0 0.75rem;
  color: var(--bs-secondary-color, #555);
}
.book-extras-box p { margin: 0 0 0.4rem; }
.book-extras-box p:last-child, .book-extras-box ul:last-child { margin-bottom: 0; }
.book-extras-title {
  font-weight: 600;
  color: var(--bs-body-color, #222);
}
.book-extras-endpoint code {
  font-size: 0.8rem;
  word-break: break-all;
}
.book-extras-copy {
  margin-left: 0.4rem;
  padding: 0 0.45rem;
  font-size: 0.75rem;
  line-height: 1.6;
  border: 1px solid var(--bs-border-color, #ccc);
  border-radius: 4px;
  background: transparent;
  color: inherit;
  cursor: pointer;
}
.book-extras-install { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.book-extras-install img { height: 24px; width: auto; vertical-align: middle; }
</style>
<script>
document.addEventListener("click", function (e) {
  var btn = e.target.closest && e.target.closest(".book-extras-copy");
  if (!btn || !navigator.clipboard) return;
  navigator.clipboard.writeText(btn.getAttribute("data-copy")).then(function () {
    var label = btn.textContent;
    btn.textContent = "Copied";
    setTimeout(function () { btn.textContent = label; }, 1500);
  });
});
</script>
